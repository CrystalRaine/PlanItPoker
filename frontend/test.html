<!-- MVP plan it poker frontend -->

<!DOCTYPE html>
<html>
<head>
    <title>Plan-It-Poker</title>
</head>
<body>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <h1>Plan-It-Poker </h1>
    <h2 id="roomId"></h2>
    <h2 id="avg"></h2>
    
    <div id="joinCreate">
        <div>
            <input type="username" id="username" placeholder="username">
        </div>
        <div>
            <input type="text" id="roomIdInput" placeholder="##########">
            <button id="joinButton">join</button>
            <button id="createButton">create</button>
        </div>
    </div>

    <div id="voteCards"></div>
    <div id="controls"></div>
    <div id="players"></div>
    <div id="logDiv"></div>

    <script>
        let logs = false;
        function showLogs() {
            if(logs){
                $('#messages').prop("hidden", true);
                $('#logs').html("Show Logs");
            } else {
                $('#messages').prop("hidden", false);
                $('#logs').html("Hide Logs");
            }
            logs = !logs;
        }

        const ws = new WebSocket('ws://localhost:3000');

        ws.onopen = () => {
            console.log('Connected to WebSocket server');
        };

        ws.onmessage = event => {
            const voteDiv = $('#voteCards');
            const playersDiv = $('#players');
            const controlDiv = $('#controls');
            const roomIdDisplay = $('#roomId');
            const joinCreate = $('#joinCreate');
            const avgDisplay = $('#avg');
            const logDiv = $('#logDiv');

            msgObj = JSON.parse(event.data);

            if(msgObj.type !== 'roomStatus'){
                return;
            }

            playersDiv.html("");
            voteDiv.html("");
            controlDiv.html("");
            roomIdDisplay.html("");
            joinCreate.html("");
            avgDisplay.html("");

            logDiv.html('<div id="messages" hidden></div><button id="logs" onclick="showLogs();">Show Logs</button>');
            roomIdDisplay.html(`Room ID: ${msgObj.config.roomID}`);
            
            const messagesDiv = $('#messages');
            messagesDiv.html(`<p>${event.data}</p><p>${msgObj.logs.join("<p></p>")}</p>`);

            if(msgObj.cardsRevealed) {
                controlDiv.append("<button id='reset'>Reset</button>");
                $('#reset').click(()=>{
                    ws.send(JSON.stringify({
                        type: "clear", 
                    }));
                })

                let avg = msgObj.members.reduce((acc, curr)=>{
                    if(curr.currentChoice === null){
                        return acc;
                    }
                    return acc + msgObj.config.voteValues[msgObj.config.voteOptions.indexOf(curr.currentChoice)];
                }, 0);

                const votingMembers = msgObj.config.hostCanVote ? msg.members.length : msgObj.members.length - 1;

                avg = avg / votingMembers;

                avgDisplay.html(`AVG: ${avg}`);
            }

            if((!msgObj.client.role === "host" || msgObj.config.hostCanReveal) && !msgObj.cardsRevealed && !msgObj.members.find((member)=>(!(member.voted || (member.role === "host" && !msgObj.config.hostCanVote))))) {
                controlDiv.append("<button id='reveal'>Reveal</button>");
                $('#reveal').click(()=>{
                    ws.send(JSON.stringify({
                        type: "reveal", 
                    }));
                })
            }

            if(!(!msgObj.config.hostCanVote && msgObj.client.role === "host")){
                msgObj.config.voteOptions.forEach((option, index) => {
                    voteDiv.append(`<span><button id='vote${index}'>${option}</button></span>`);
                    $(`#vote${index}`).click(()=>{
                        ws.send(JSON.stringify({
                            type: "vote",
                            input: option,
                        }));
                    });
                });
                $(`#vote${msgObj.config.voteOptions.indexOf(msgObj.client.currentChoice)}`).prop('disabled', true); 
            }


            msgObj.members.forEach((member) => {
                if(member.role === "host" && !msgObj.config.hostCanVote){
                    return;
                }
                playersDiv.append(`<span>${member.name}: ${member.currentChoice === null ? (member.voted ? "VOTED" : "WAITING") : member.currentChoice}</span>`)
            });

        };

        ws.onclose = () => {
            console.log('Disconnected from WebSocket server');
        };

        ws.onerror = error => {
            console.error('WebSocket error:', error);
        };

        document.getElementById('joinButton').onclick = () => {
            const messageInput = $('#roomIdInput');
            const usernameInput = $('#username');
            ws.send(JSON.stringify({
                type: "join", 
                input: messageInput.val(),
                username: usernameInput.val(),
            }));
            messageInput.val('');
        };

        document.getElementById('createButton').onclick = () => {
            const messageInput = $('#roomIdInput');
            const usernameInput = $('#username');
            ws.send(JSON.stringify({
                type: "create",
                input: messageInput.val(),
                username: usernameInput.val(),
            }));
            messageInput.val('');
        };
    </script>
</body>
</html>
